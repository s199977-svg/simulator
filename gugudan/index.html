<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>구구단 스피드 챌린지</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="구구단 챌린지 홈"><span class="brand-mark">×</span><span>구구단 챌린지<small>30-SECOND SPRINT</small></span></a>
        <span class="time-badge">◷ <b>30초</b> 제한</span>
      </header>

      <section class="intro">
        <p class="eyebrow">READY, SET, MULTIPLY!</p>
        <h1>구구단 스피드 챌린지</h1>
        <p>문항 수를 고르고, 30초 동안 몇 개를 맞히는지 도전해요.</p>
      </section>

      <section class="challenge-card">
        <div id="setup-screen">
          <div class="big-symbol">×</div>
          <h2>몇 문제에 도전할까요?</h2>
          <p class="description">선택한 문항을 모두 풀거나 30초가 지나면 챌린지가 끝나요.</p>
          <div class="presets" aria-label="문항 수 빠른 선택">
            <button type="button" class="preset" data-count="10">10문제</button>
            <button type="button" class="preset selected" data-count="20">20문제</button>
            <button type="button" class="preset" data-count="30">30문제</button>
            <button type="button" class="preset" data-count="50">50문제</button>
          </div>
          <form id="setup-form" class="setup-form">
            <label for="question-total">도전 문항 수 <span>1~64문제</span></label>
            <input id="question-total" type="number" min="1" max="64" step="1" value="20" required />
            <div class="limit"><span>◷</span><strong>제한 시간</strong><b>30초</b></div>
            <button class="primary-button start-button" type="submit">챌린지 시작하기 <span>→</span></button>
          </form>
        </div>

        <div id="play-screen" class="hidden">
          <div class="play-header">
            <div class="timer"><span>남은 시간</span><strong id="timer-value">30.0</strong><small>초</small></div>
            <div class="play-stat"><span>정답</span><strong><b id="correct-total">0</b>개</strong></div>
            <div class="play-stat"><span>진행</span><strong id="progress-text">0 / 20</strong></div>
          </div>
          <div class="progress-track"><i id="progress-bar"></i></div>
          <form id="answer-form">
            <p class="question-count" id="question-count">문제 1 / 20</p>
            <div class="equation"><span id="factor-one">3</span><span class="multiply">×</span><span id="factor-two">4</span><span class="equals">=</span><span class="unknown">?</span></div>
            <label class="sr-only" for="answer-input">정답 입력</label>
            <div class="answer-row">
              <input id="answer-input" type="number" min="0" max="81" inputmode="numeric" autocomplete="off" placeholder="정답" required />
              <button id="submit-answer" class="primary-button" type="submit">확인</button>
            </div>
            <p id="feedback" class="feedback" aria-live="polite"></p>
          </form>
        </div>

        <div id="result-screen" class="hidden">
          <div class="medal">✦</div>
          <p class="eyebrow">CHALLENGE COMPLETE</p>
          <h2 id="result-title">30초 도전이 끝났어요!</h2>
          <p class="description" id="result-message"></p>
          <div class="score"><strong id="result-correct">0</strong><span>개 정답</span></div>
          <div class="result-stats"><span>푼 문제 <b id="result-answered">0</b></span><span>정확도 <b id="result-accuracy">0%</b></span></div>
          <button id="retry-button" class="primary-button start-button" type="button">다시 도전하기 <span>↻</span></button>
        </div>
      </section>
      <footer>한 문제씩 풀다 보면 구구단이 더 쉬워져요 <span>✦</span></footer>
    </main>
  </body>
</html>
